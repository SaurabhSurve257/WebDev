<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Cartoon avatar of Saurabh with laptop">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feComposite in="b" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="32" fill="url(#bgGrad)" />

  <!-- subtle halo behind avatar -->
  <circle cx="200" cy="120" r="96" fill="url(#halo)" />

  <!-- laptop -->
  <g transform="translate(80,200)">
    <rect x="0" y="36" width="240" height="12" rx="6" fill="#071023" opacity="0.9" />
    <rect x="16" y="0" width="208" height="64" rx="8" fill="#0f1724" />
    <rect x="28" y="10" width="184" height="44" rx="6" fill="#e6eefc" opacity="0.06" />
    <rect x="84" y="52" width="32" height="6" rx="3" fill="#94a3b8" />
    <g transform="translate(38,14)">
      <rect x="0" y="0" width="32" height="20" rx="3" fill="#0ea5e9" opacity="0.12" />
      <rect x="40" y="0" width="84" height="20" rx="3" fill="#2563eb" opacity="0.08" />
    </g>
  </g>

  <!-- person (head + shoulders) -->
  <g transform="translate(140,60)">
    <ellipse cx="60" cy="48" rx="50" ry="40" fill="#ffd9a8" />
    <path d="M20 50 C30 22, 94 22, 110 50 C98 40, 34 40, 20 50 Z" fill="#2b2b2b" />
    <circle cx="46" cy="50" r="5" fill="#2b2b2b" />
    <circle cx="74" cy="50" r="5" fill="#2b2b2b" />
    <path d="M46 66 C56 76, 68 76, 78 66" stroke="#2b2b2b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <rect x="30" y="86" width="60" height="46" rx="12" fill="#06b6d4" />
    <rect x="34" y="90" width="52" height="38" rx="8" fill="#0369a1" opacity="0.18" />
  </g>

  <!-- decorative stars -->
  <g fill="#93c5fd" opacity="0.12">
    <circle cx="320" cy="60" r="6" />
    <circle cx="300" cy="34" r="4" />
    <circle cx="60" cy="40" r="5" />
  </g>

  <!-- name plate (transparent) -->
  <g transform="translate(0,320)">
    <rect x="60" y="0" width="280" height="56" rx="28" fill="#ffffff" opacity="0.05" />
    <text x="200" y="36" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#e6eefc" text-anchor="middle" font-weight="700">Saurabh Surve</text>
  </g>

  <title>Cartoon avatar of Saurabh with a laptop</title>
</svg>
